# Exerclse on Railway — nginx serves the app and proxies /api to the local Node API.
# The listen port is rewritten at container start from $PORT (see start.sh).

user nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /tmp/error.log warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /tmp/access.log;
    client_max_body_size 5m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;

        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "frame-ancestors 'none'" always;

        # API → local Node backend (no DNS needed: literal 127.0.0.1)
        location ^~ /api/ {
            client_max_body_size 5m;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location ^~ /api/media/ {
            client_max_body_size 48m;
            proxy_request_buffering off;
            proxy_buffering off;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        location / {
            try_files $uri $uri/ @root;
        }
        location @root {
            return 302 /$is_args$args;
        }

        location ~* \.(js|css|json|html)$ {
            add_header Cache-Control "no-cache, must-revalidate";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }

        location ^~ /exercise-media/ {
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
            location ~* \.(png|jpg|jpeg|gif|webp|avif|mp4)$ {
                add_header Cache-Control "public, max-age=2592000, immutable";
                add_header Cross-Origin-Resource-Policy "same-origin" always;
                add_header X-Frame-Options "DENY" always;
                add_header X-Content-Type-Options "nosniff" always;
                add_header Referrer-Policy "same-origin" always;
                add_header Content-Security-Policy "frame-ancestors 'none'" always;
            }
        }

        location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif|mp4)$ {
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Frame-Options "DENY" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "same-origin" always;
            add_header Content-Security-Policy "frame-ancestors 'none'" always;
        }
    }
}
